services:
  van-ban-analyzer-api:
    build: .
    container_name: van-ban-analyzer-api
    ports:
      - "8686:8686"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://124.197.20.172:3333/v1}
      - MODEL_NAME=${MODEL_NAME:-Qwen/Qwen3-8B}
      - TEMPERATURE=${TEMPERATURE:-0.1}
      - MAX_TOKENS=${MAX_TOKENS:-4000}
    command: uvicorn api.server:app --host 0.0.0.0 --port 8686 --reload
    restart: unless-stopped